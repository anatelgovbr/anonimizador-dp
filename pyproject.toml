[project]
name = "anonimizar-dp"
version = "1.0.4"
description = "Anonimizador de textos"
authors = [{name = "Anatel", email = "seiia@anatel.gov.br"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "spacy==3.8.4",
    "python-dotenv==1.2.2",
    "scikit-learn==1.7.2",
    "pandas>=2.0.0"

]
license = "GPL-3.0-only"
license-files = ["LICENSE*"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.11.6",
    "pdoc3==0.11.6"
]

# [project.urls]
# Homepage = "https://git.anatel.gov.br/processo_eletronico/sei-ia/sei-anonimizar"

[tool.ruff]
# Ruff - An extremely fast Python linter, written in Rust. - https://beta.ruff.rs
# Exclude commonly ignored directories.
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox", 
    ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", 
    "__pypackages__", "_build", "buck-out", "build", "dist", 
    "node_modules", "venv", "*ipynb_checkpoints","./docker/*",
    "notebooks", "docs" 
]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enable rules by category. Full list at https://beta.ruff.rs/docs/rules/.
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "COM", "D", "DTZ",
    "E", "EM", "ERA", "EXE", "F", "FBT", "G", "I", "ICN", "INP", "ISC", "N",
    "NPY", "PD", "PGH", "PIE", "PL", "PLC", "PLE", "PLR", "PLW", "PT", "PTH",
    "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TCH",
    "TID", "TRY", "UP", "W", "YTT"
]

# Rules to ignore.
ignore = [
    "COM",      # flake8-commas is no longer maintained; use other tools like black.
    "PLR0913",  # Too many arguments to function call.
    "ANN101"    # Missing type annotation for `self` in method.
]

# Allow autofix for enabled rules (when `--fix` is provided).
fixable = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "COM", "D", "DTZ",
    "E", "EM", "ERA", "EXE", "F", "FBT", "G", "I", "ICN", "INP", "ISC", "N",
    "NPY", "PD", "PGH", "PIE", "PL", "PLC", "PLE", "PLR", "PLW", "PT", "PTH",
    "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TCH",
    "TID", "TRY", "UP", "W", "YTT"
]

# Avoid trying to fix specific rule categories.
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
# Docstring convention: Google style.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for test files.
"tests/*.py" = ["S101", "ANN", "D", "INP001", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

