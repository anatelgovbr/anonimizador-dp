[options]
python_requires = >=3.10
install_requires =
    spacy==3.8.4
    python-dotenv==1.2.2
    scikit-learn==1.7.2
packages = find:
include_package_data = True

[options.extras_require]
dev =
    pytest==9.0.3
    ruff==0.11.6

[options.packages.find]
where = src
include =
    anonimizar*
    anonimizar.*
exclude =
    tests*
    docs*
    examples*
    docker*
    notebooks*
